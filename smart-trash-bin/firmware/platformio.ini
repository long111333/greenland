[env:uno]
platform = atmelavr@5.1.0
board = uno
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/prepare_upload.py
lib_deps =
    arduino-libraries/Servo@1.2.2
    waspinator/AccelStepper@1.64
    bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra -D ARDUINOJSON_USE_LONG_LONG=0
upload_port = COM5
monitor_port = COM5
